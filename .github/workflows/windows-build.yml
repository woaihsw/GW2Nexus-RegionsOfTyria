name: Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run addon_units
        run: tests/run_units.sh

  build:
    needs: unit-tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Integrate vcpkg
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          if (!(Test-Path $vcpkg)) {
            $vcpkg = "vcpkg"
          }
          $installRoot = Join-Path $PWD "vcpkg_installed\x64-windows-static"
          & $vcpkg integrate install
          & $vcpkg install --triplet x64-windows-static "--x-install-root=$installRoot"

      - name: Build Release x64
        run: >
          msbuild GW2Nexus-RegionsDisplay.sln
          /m
          /restore
          /p:Configuration=Release
          /p:Platform=x64
          /p:VcpkgManifestInstall=false
          /p:VcpkgUseStatic=true
          /p:VcpkgTriplet=x64-windows-static

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: RegionsDisplay
          path: x64/RegionsDisplay.dll
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download DLL
        uses: actions/download-artifact@v4
        with:
          name: RegionsDisplay
          path: release-dll

      - name: Flatten DLL path
        run: |
          set -euo pipefail
          dll="$(find release-dll -name 'RegionsDisplay.dll' | head -n 1)"
          test -n "$dll"
          cp "$dll" RegionsDisplay.dll

      - name: Require tag to match AddonDef.Version
        id: version
        run: |
          set -euo pipefail
          source_version="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("src/entry.cpp").read_text(encoding="utf-8", errors="replace")
          fields = {}
          for name in ("Major", "Minor", "Build", "Revision"):
              match = re.search(rf"Version\.{name}\s*=\s*(\d+)", text)
              if not match:
                  raise SystemExit(f"Could not find Version.{name} in src/entry.cpp")
              fields[name] = match.group(1)
          print(".".join(fields[name] for name in ("Major", "Minor", "Build", "Revision")))
          PY
          )"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "$source_version" ]; then
            echo "Git tag '$tag' must exactly match AddonDef.Version '$source_version' (no v prefix)."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing release $tag"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: RegionsDisplay.dll
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
