name: Windows Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Integrate vcpkg
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          if (!(Test-Path $vcpkg)) {
            $vcpkg = "vcpkg"
          }
          $installRoot = Join-Path $PWD "vcpkg_installed\x64-windows-static"
          & $vcpkg integrate install
          & $vcpkg install --triplet x64-windows-static "--x-install-root=$installRoot"

      - name: Build Release x64
        run: >
          msbuild GW2Nexus-RegionsDisplay.sln
          /m
          /restore
          /p:Configuration=Release
          /p:Platform=x64
          /p:VcpkgManifestInstall=false
          /p:VcpkgUseStatic=true
          /p:VcpkgTriplet=x64-windows-static

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: RegionsDisplay
          path: x64/RegionsDisplay.dll
          if-no-files-found: error

      - name: Read addon version
        if: github.event_name != 'pull_request'
        id: version
        shell: pwsh
        run: |
          $text = Get-Content -Raw "src/entry.cpp"
          function Read-Field([string]$name) {
            if ($text -match "Version\.$name\s*=\s*(\d+)") {
              return $Matches[1]
            }
            throw "Could not find Version.$name in src/entry.cpp"
          }
          $tag = "$(Read-Field 'Major').$(Read-Field 'Minor').$(Read-Field 'Build').$(Read-Field 'Revision')"
          if ($env:GITHUB_REF.StartsWith("refs/tags/")) {
            $tag = $env:GITHUB_REF_NAME.TrimStart("v")
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Release tag: $tag"

      - name: Publish GitHub Release
        if: >
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/fix/chinese-locale' ||
           startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: x64/RegionsDisplay.dll
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
